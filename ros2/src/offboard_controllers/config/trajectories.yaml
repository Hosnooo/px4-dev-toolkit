# Trajectory references use PX4 local NED coordinates.
# Each trajectory is anchored to the vehicle position when Offboard starts.
# After the final segment, the last reference is held indefinitely.

default_yaw: 0.0

segments:
  hold_1s:
    type: hold
    duration: 1.0

  hold_2s:
    type: hold
    duration: 2.0

  step_x_1m:
    type: step
    duration: 4.0
    offset: [1.0, 0.0, 0.0]

  step_y_1m:
    type: step
    duration: 4.0
    offset: [0.0, 1.0, 0.0]

  step_z_1m:
    type: step
    duration: 4.0
    offset: [0.0, 0.0, -1.0]

  line_x_2m:
    type: line
    duration: 4.0
    offset: [2.0, 0.0, 0.0]

  circle_r1:
    type: circle
    duration: 8.0
    radius: 1.0
    turns: 1.0

  helix_r1_h1:
    type: helix
    duration: 10.0
    radius: 1.0
    height: -1.0
    turns: 2.0

  north_1m:
    type: line
    duration: 4.0
    offset: [1.0, 0.0, 0.0]

  east_1m:
    type: line
    duration: 4.0
    offset: [0.0, 1.0, 0.0]

  up_1m:
    type: line
    duration: 4.0
    offset: [0.0, 0.0, -1.0]

  yaw_plus_90deg:
    type: yaw
    duration: 4.0
    yaw_offset: 1.5707963267948966

  yaw_minus_90deg:
    type: yaw
    duration: 4.0
    yaw_offset: -1.5707963267948966

  return_to_start:
    type: line
    duration: 6.0
    offset: [-1.0, -1.0, 1.0]

  figure_eight_2x1m:
    type: figure_eight
    duration: 60.0
    x_amplitude: 2.0
    y_amplitude: 1.0
    turns: 3.0


trajectories:
  hover:
    segments:
      - hold_2s

  step_response:
    segments:
      - hold_2s
      - step_x_1m
      - hold_2s

  line_tracking:
    segments:
      - hold_2s
      - line_x_2m
      - hold_2s

  circle_tracking:
    segments:
      - hold_2s
      - circle_r1
      - hold_2s

  helix_tracking:
    segments:
      - hold_2s
      - line_x_2m
      - circle_r1
      - helix_r1_h1
      - hold_2s

  translation_yaw_sweep:
    segments:
      - hold_2s
      - north_1m
      - hold_1s
      - east_1m
      - hold_1s
      - up_1m
      - hold_1s
      - yaw_plus_90deg
      - hold_1s
      - return_to_start
      - yaw_minus_90deg
      - hold_2s

  figure_eight_tracking:
    segments:
      - hold_2s
      - figure_eight_2x1m
      - hold_2s

  full_excitation:
    segments:
      - hold_2s
      - step_x_1m
      - hold_1s
      - step_y_1m
      - hold_1s
      - step_z_1m
      - hold_1s
      - yaw_plus_90deg
      - hold_1s
      - figure_eight_2x1m
      - yaw_minus_90deg
      - return_to_start
      - hold_2s
